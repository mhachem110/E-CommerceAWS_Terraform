name: retail-demo

x-backend: &backend
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 3s
    retries: 5

services:
  product:
    <<: *backend
    build:
      context: ./backend
      args: { SERVICE: product }
    environment:
      DB_PATH: /data/product.db
    volumes:
      - product-data:/data

  inventory:
    <<: *backend
    build:
      context: ./backend
      args: { SERVICE: inventory }
    environment:
      DB_PATH: /data/inventory.db
    volumes:
      - inventory-data:/data

  notification:
    <<: *backend
    build:
      context: ./backend
      args: { SERVICE: notification }
    environment:
      DB_PATH: /data/notification.db
    volumes:
      - notification-data:/data

  order:
    <<: *backend
    build:
      context: ./backend
      args: { SERVICE: order }
    environment:
      DB_PATH: /data/order.db
      PRODUCT_URL: http://product:8000
      INVENTORY_URL: http://inventory:8000
      NOTIFICATION_URL: http://notification:8000
    volumes:
      - order-data:/data
    depends_on:
      product: { condition: service_healthy }
      inventory: { condition: service_healthy }
      notification: { condition: service_healthy }

  storefront:
    build: ./frontend
    environment:
      PRODUCT_HOST: product
      ORDER_HOST: order
      NGINX_ENVSUBST_FILTER: '^(PRODUCT_HOST|ORDER_HOST)$'
    ports:
      - "8080:8080"
    depends_on:
      product: { condition: service_healthy }
      order: { condition: service_healthy }
    restart: unless-stopped

volumes:
  product-data:
  inventory-data:
  order-data:
  notification-data:
