name: App CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product, inventory, order, notification]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t retail-${{ matrix.service }}:ci backend
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: retail-${{ matrix.service }}:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t retail-storefront:ci frontend
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: retail-storefront:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - run: docker run --rm --add-host=product:127.0.0.1 --add-host=order:127.0.0.1 -e PRODUCT_HOST=product -e ORDER_HOST=order -e 'NGINX_ENVSUBST_FILTER=^(PRODUCT_HOST|ORDER_HOST|DNS_RESOLVER)$' retail-storefront:ci nginx -t

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - run: helm lint deploy/helm/retail
      - run: helm template retail deploy/helm/retail > rendered.yaml
      - run: python deploy/aws/render_values.py --config deploy/aws/example-config.json --tag ci --output-dir /tmp/retail-render
      - run: helm template retail deploy/helm/retail --namespace retail --values /tmp/retail-render/values.json > cloud-rendered.yaml
